<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Luna Dresses</title>
  <meta name="description" content="Sign in to your Luna Dresses account to manage your shopping cart, saved dresses, and orders.">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- Navigation Header -->
  <header id="main-header"></header>

  <main class="section">
    <div class="container">
      <div class="auth-container">
        <div class="text-center" style="margin-bottom: 2rem;">
          <h2 style="font-size: 2rem;">Welcome Back</h2>
          <p style="color: var(--text-muted); font-size: 0.95rem;">Sign in to access your saved boutique items & orders.</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email" class="form-label">Email Address</label>
            <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
              <label for="login-password" class="form-label" style="margin:0;">Password</label>
              <a href="#" style="font-size:0.82rem; color:var(--primary);">Forgot Password?</a>
            </div>
            <input type="password" id="login-password" class="form-input" placeholder="Enter password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem;">Sign In</button>
        </form>

        <div style="margin-top: 1.5rem; background: var(--primary-light); border: 1px dashed var(--primary); padding: 1rem; border-radius: var(--radius-md); font-size: 0.88rem; color: var(--text-main);">
          <strong>💡 Quick Demo Sign-In:</strong><br>
          Register a new account or click below to fill demo user details.<br>
          <button type="button" id="fill-demo-btn" class="btn btn-sm btn-outline" style="margin-top:0.5rem; background:white; font-size:0.8rem; width:100%;">Fill Demo Credentials</button>
        </div>

        <div class="text-center" style="margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); font-size: 0.95rem;">
          Don't have an account? <a href="register.html" style="font-weight:700;">Create One Here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Navigation Footer -->
  <footer id="main-footer"></footer>

  <!-- JavaScript Modules -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderHeader('login');
      UI.renderFooter();

      // Redirect if already logged in
      if (Auth.isAuthenticated()) {
        window.location.href = 'shop.html';
        return;
      }

      // Demo login filler
      const demoBtn = document.getElementById('fill-demo-btn');
      demoBtn.addEventListener('click', () => {
        // Create demo user if none exists
        const users = Storage.getUsers();
        let demoUser = users.find(u => u.email === 'demo@lunadresses.com');
        if (!demoUser) {
          Auth.register('Victoria Sterling', 'demo@lunadresses.com', 'password123');
        }
        document.getElementById('login-email').value = 'demo@lunadresses.com';
        document.getElementById('login-password').value = 'password123';
        UI.showToast('Demo credentials filled! Click Sign In.', 'info');
      });

      const form = document.getElementById('login-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const res = Auth.login(email, password);
        if (res.success) {
          UI.showToast(res.message, 'success');
          setTimeout(() => {
            window.location.href = 'shop.html';
          }, 800);
        } else {
          UI.showToast(res.message, 'danger');
        }
      });
    });
  </script>
</body>
</html>
