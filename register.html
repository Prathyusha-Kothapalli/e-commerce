<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | Luna Dresses</title>
  <meta name="description" content="Create a Luna Dresses account to save your favorite dresses, track orders, and enjoy express checkout.">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- Navigation Header -->
  <header id="main-header"></header>

  <main class="section">
    <div class="container">
      <div class="auth-container">
        <div class="text-center" style="margin-bottom: 2rem;">
          <h2 style="font-size: 2rem;">Create An Account</h2>
          <p style="color: var(--text-muted); font-size: 0.95rem;">Join Luna Dresses for exclusive boutique access & order tracking.</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label for="reg-name" class="form-label">Full Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. Eleanor Vance" required>
          </div>

          <div class="form-group">
            <label for="reg-email" class="form-label">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label for="reg-password" class="form-label">Password</label>
            <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" required minlength="6">
          </div>

          <div class="form-group">
            <label for="reg-confirm-password" class="form-label">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter password" required minlength="6">
          </div>

          <div class="form-group" style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1.5rem;">
            <input type="checkbox" id="reg-terms" required style="accent-color:var(--primary); width:16px; height:16px;">
            <label for="reg-terms" style="font-size:0.88rem; color:var(--text-muted);">
              I agree to the <a href="#" style="text-decoration:underline;">Terms of Service</a> & Privacy Policy.
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
        </form>

        <div class="text-center" style="margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); font-size: 0.95rem;">
          Already have an account? <a href="login.html" style="font-weight:700;">Sign In Here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Navigation Footer -->
  <footer id="main-footer"></footer>

  <!-- JavaScript Modules -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderHeader('register');
      UI.renderFooter();

      // Redirect if already logged in
      if (Auth.isAuthenticated()) {
        window.location.href = 'shop.html';
        return;
      }

      const form = document.getElementById('register-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;

        if (password !== confirmPassword) {
          UI.showToast('Passwords do not match.', 'danger');
          return;
        }

        const res = Auth.register(name, email, password);
        if (res.success) {
          UI.showToast(res.message, 'success');
          setTimeout(() => {
            window.location.href = 'shop.html';
          }, 1000);
        } else {
          UI.showToast(res.message, 'danger');
        }
      });
    });
  </script>
</body>
</html>
